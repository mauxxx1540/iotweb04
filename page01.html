<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Monomaniac+One&display=swap"rel="stylesheet"/>
    <style>
      body {
        background-color: rgb(14, 10, 1);
      }
      a,
      i {
        color: white;
        font-size: 1.5rem;
      }
      .nav-hello span {
        color: #40ff00;
        font-family: itim;
        font-size: 3.5rem;
        font-style: italic;
      }
      .nav-menu a {
        font-family: monomaniac one;
        text-decoration: none;
      }
      .navbar {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 50px 80px;
      }
      .nav-menu,
      .nav-hello,
      .nav-icons {
        width: 100%;
      }
      .nav-hello {
        text-align: center;
      }
      .nav-icons {
        display: flex;
        justify-content: flex-end;
        gap: 30px;
      }
      .nav-menu {
        display: flex;
        gap: 30px;
      }
      .per-info span {
        color: rgb(255, 0, 140);

        font-family: monomaniac one;
        font-size: 2.5rem;
      }
      .per-info {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #mom{
         color: blueviolet;
      }
      .per-pic{
         margin-top: 80px;
         display: flex;
         justify-content: center;
      }
      img{
         width: 350px;
         height: 300px;
         object-fit: cover;
         border-radius: 50%;
         border: 5px solid rgb(202, 194, 210);
         padding: 15px;
      }
      i:hover{
         color:blue
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- navbar -->
      <div class="navbar">
        <div class="nav-menu">
          <a href="">Portfolio</a>
          <a href="">About me</a>
          <a href="">Get In Touch</a>
        </div>

        <div class="nav-hello">
          <span>Hello</span>
        </div>

        <div  class="nav-icons">
                <a href=""><i class="bi bi-github"></i></a>
                <a href=""><i class="bi bi-linkedin"></i></a>
                <a href=""><i class="bi bi-instagram"></i></a>
                <a href=""><i class="bi bi-twitter"></i></a>
            
        </div>
      </div>
      <!-- personnel -->
      <div class="personnel"></div>

      <!-- picture -->
      <div class="picture"></div>

      <div class="per-info">
        <span>6819M10004</span>
        <span>THITIWORADA THAMMACHAI</span>
        <span id="mom">Freelance Web Developer</span>
        <span>Based In Thailand</span>
      </div>


      <div class="per-pic">
         <img src="./images/image.jpg" alt="">
      </div>
    </div>
  </body>
</html>
